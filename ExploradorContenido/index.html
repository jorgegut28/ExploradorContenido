<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de contenido aleatorio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="text-center py-5">
    <div class="container">
      <h1 class="display-5 fw-bold">Explorador de contenido aleatorio</h1>
      <p class="lead">Descubre citas, animales y datos curiosos usando APIs públicas.</p>
    </div>
  </header>

  <main class="container pb-5">
    <div class="row g-4">
      
      <div class="col-12 col-md-6">
        <section class="card h-100 shadow-sm content-card">
          <div class="card-body d-flex flex-column">
            <h2 class="h4 card-title"> Citas</h2>
            <div id="quote-content" class="content-area flex-grow-1">
              <p class="placeholder-text">Presiona el botón para obtener una cita.</p>
            </div>
            <p id="quote-status" class="status-message" aria-live="polite"></p>
            <button id="quote-button" class="btn btn-primary mt-auto">Obtener otra cita</button>
          </div>
        </section>
      </div>

     
      <div class="col-12 col-md-6">
        <section class="card h-100 shadow-sm content-card">
          <div class="card-body d-flex flex-column">
            <h2 class="h4 card-title"> Perros</h2>
            <div id="dog-content" class="content-area flex-grow-1">
              <p class="placeholder-text">Presiona el botón para ver un perro.</p>
            </div>
            <p id="dog-status" class="status-message" aria-live="polite"></p>
            <button id="dog-button" class="btn btn-primary mt-auto">Mostrar otro perro</button>
          </div>
        </section>
      </div>

      
      <div class="col-12 col-md-6">
        <section class="card h-100 shadow-sm content-card">
          <div class="card-body d-flex flex-column">
            <h2 class="h4 card-title"> Gatos</h2>
            <div id="cat-content" class="content-area flex-grow-1">
              <p class="placeholder-text">Presiona el botón para ver un gato.</p>
            </div>
            <p id="cat-status" class="status-message" aria-live="polite"></p>
            <button id="cat-button" class="btn btn-primary mt-auto">Mostrar otro gato</button>
          </div>
        </section>
      </div>

      
      <div class="col-12 col-md-6">
        <section class="card h-100 shadow-sm content-card">
          <div class="card-body d-flex flex-column">
            <h2 class="h4 card-title"> Datos curiosos</h2>
            <div id="fact-content" class="content-area flex-grow-1">
              <p class="placeholder-text">Presiona el botón para obtener un dato.</p>
            </div>
            <p id="fact-status" class="status-message" aria-live="polite"></p>
            <button id="fact-button" class="btn btn-primary mt-auto">Mostrar otro dato</button>
          </div>
        </section>
      </div>
    </div>
  </main>

 
  <script src="script.js"></script>
</body>
</html>
